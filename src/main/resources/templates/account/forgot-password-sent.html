<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Check your email')}"></head>
<body class="auth-body">
<div th:replace="~{fragments/layout :: header('')}"></div>
<main class="message-page page-wrap"><section class="message-card"><span class="message-icon"><svg class="icon"><use href="/icons/lucide.svg#mail"></use></svg></span><p class="eyebrow"><span class="eyebrow-line"></span> Password recovery</p><h1>Check your inbox.</h1><p>If an active, verified account matches that email address, we sent a password reset link.</p><p class="message-muted">For your security, this message is the same whether or not an account exists. The link expires after 30 minutes and can only be used once.</p><a class="button button-outline" href="/login">Back to log in</a></section></main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
